<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYGAMES CONDO - V2</title>
  <video src="ijfz6l.mp4" autoplay muted loop playsinline></video>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif}
  body{background:#0a1226;color:white;min-height:100vh}
  header{
    background:#0f1a33;
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;border-bottom:1px solid #2a3a5e;
    position:sticky;top:0;z-index:10;
  }
  .logo{font-weight:900;line-height:1.1;font-size:22px;letter-spacing:1px;color:#ff5da2}
  .logo span{display:block}
  .badge-v2{
    background:#ff5da2;color:#2a0a1a;font-weight:900;
    padding:4px 12px;border-radius:6px;font-size:15px;margin:0 10px;
  }
  nav{display:flex;gap:16px;flex-wrap:wrap;font-size:17px;color:#8a9ab5;font-weight:600}
  nav a{color:#8a9ab5;text-decoration:none}
  nav a.active{color:white}

  .container{max-width:480px;margin:0 auto;padding:24px 16px 40px}
  .title-wrap{border-left:5px solid #ff5da2;padding-left:14px;margin-bottom:20px}
  .title-wrap h1{font-size:34px;line-height:1}
  .title-wrap p{color:#8a9ab5;margin-top:6px;font-size:16px}

  .card{
    background:#13203e;border:1px solid #2a3a5e;border-radius:18px;
    overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)
  }
  .card-img{position:relative;height:220px;overflow:hidden;background:#000}
  .card-img img{width:100%;height:100%;object-fit:cover}
  .online{
    position:absolute;top:12px;right:12px;
    background:rgba(0,0,0,.6);border:1.5px solid #00c853;color:#00e676;
    padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;
    display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)
  }
  .online i{width:8px;height:8px;background:#00e676;border-radius:50%;display:block}
  .card-body{padding:18px}
  .card-body h2{font-size:30px;margin-bottom:14px}
  .players{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .avatars{display:flex}
  .avatars img{
    width:42px;height:42px;border-radius:50%;object-fit:cover;
    border:2.5px solid #ff5da2;margin-left:-8px;
  }
  .avatars img:first-child{margin-left:0}
  .players span{color:#8a9ab5;font-size:18px;font-weight:600}
  .btn{
    display:block;width:100%;text-align:center;text-decoration:none;
    background:#ff5da2;color:white;font-weight:900;font-size:20px;
    letter-spacing:1px;padding:15px;border-radius:12px;
    box-shadow:0 5px 20px rgba(255,93,162,.4);transition:.2s;
  }
  .btn:hover{background:#ff3f90;transform:scale(1.01)}
  .btn:active{transform:scale(.98)}
  footer{text-align:center;color:#5a6a85;font-size:13px;padding:20px}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center">
    <div class="logo"><span>PLAYGAMES</span><span>CONDO</span></div>
    <div class="badge-v2">V2</div>
  </div>
  <nav>
    <a href="#" class="active">Home</a>
    <a href="#">Games</a>
    <a href="#">Discord</a>
  </nav>
</header>

<div class="container">
  <div class="title-wrap">
    <h1>Private Server</h1>
    <p>Click the button below to join the game server.</p>
  </div>

  <div class="card">
    <div class="card-img">
      
      <img src="https://images.unsplash.com/photo-1512918728675-ed5a9ecdebfd?w=800&q=80" alt="Condo">
      <div class="online"><i></i> ONLINE</div>
    </div>
    <div class="card-body">
      <h2>Server 01</h2>
      <div class="players">
        <div class="avatars">
          <img src="https://i.pravatar.cc/100?img=47" alt="">
          <img src="https://i.pravatar.cc/100?img=32" alt="">
          <img src="https://i.pravatar.cc/100?img=12" alt="">
        </div>
        <span>6 / 12 Online</span>
      </div>
      
      <a href="#"https://roblox.com.bz/games/14153443454/Meet-a-neko?privateServerLinkCode=70491132284956420592075041926979 class="btn">JOIN SERVER</a>
    </div>
  </div>
</div>

<footer>© 2026 PLAYGAMES CONDO - V2</footer>

</body>
</html>
